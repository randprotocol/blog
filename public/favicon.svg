<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 25 25">
  <!-- The Rand mark, bare: one 4x4 tile of the wallet's entropy field
       (ui/lib/entropy.js markSvg), as it sits in the header. Ink cells on a
       light tab strip, bone on a dark one; the hot pixel is the accent. -->
  <style>
    .c { fill: #0E1220; }
    .hot { fill: #1E4FBF; }
    @media (prefers-color-scheme: dark) {
      .c { fill: #ECE9E2; }
      .hot { fill: #5B8DEF; }
    }
  </style>
  <rect class="c" x="0" y="0" width="5" height="5"/><rect class="c" x="12" y="0" width="5" height="5"/>
  <rect class="c" x="6" y="6" width="5" height="5"/><rect class="c" x="18" y="6" width="5" height="5"/>
  <rect class="c" x="0" y="12" width="5" height="5"/><rect class="c" x="12" y="12" width="5" height="5"/>
  <rect class="c" x="6" y="18" width="5" height="5"/><rect class="c" x="18" y="18" width="5" height="5"/>
  <rect class="c" x="6" y="0" width="5" height="5"/>
  <rect class="hot" x="18" y="12" width="5" height="5"/>
</svg>
