# The blog at https://randprotocol.org/blog/ — static files from this repository's dist/,
# shipped by deploy.sh to /var/www/randprotocol-blog/blog/ on the randprotocol.org droplet.
#
# ---------------------------------------------------------------------------
# Add everything below INSIDE the `server { listen 443 ... }` block of
# /etc/nginx/sites-available/randprotocol, before `location / {`. Once; a
# deploy of the blog changes files only. Then `nginx -t && systemctl reload nginx`.
# ---------------------------------------------------------------------------
#
# Why its own directory and `root`, not a blog/ inside /var/www/randprotocol: the main site
# deploys with `rsync --delete` into that webroot, which would delete the blog on its next
# deploy. With `root /var/www/randprotocol-blog` the URI /blog/x maps to
# /var/www/randprotocol-blog/blog/x, so there is no `alias`, and `try_files` works as it does
# for the main site.
#
# `^~`, as for the API locations: once this prefix matches, no regex location is tried, so
# nothing else in the vhost (the key pages' CSP snippet, anything added later) can take a
# /blog/ request.
#
# No Content-Security-Policy is set here, as for every page of the site except /account and
# /address; none of the blog's needs depend on one. DEPLOY.md has the policy that fits the
# blog, tested, for the day the site sends one everywhere.

# /blog, without the slash.
location = /blog {
    return 301 /blog/;
}

location ^~ /blog/ {
    root /var/www/randprotocol-blog;
    index index.html;

    # A directory URL without its slash (/blog/posts/foo) is redirected to the slash form by
    # `$uri/`; anything else that is missing gets the blog's own 404 page, with status 404.
    try_files $uri $uri/ =404;
    error_page 404 /blog/404.html;

    # Pages, the feed, the sitemap, the search index and the OG images keep their names
    # across deploys, so a cache must revalidate them (nginx answers 304 from ETag and
    # Last-Modified). no-cache means "check before reuse", not "do not store".
    add_header Cache-Control "no-cache";
    # add_header in a location replaces the server's set, so the site's other headers are repeated.
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Aggressive caching for hashed Astro assets (CSS, JS, fonts): the name changes when the
    # content does.
    location /blog/_astro/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header X-Frame-Options DENY;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
